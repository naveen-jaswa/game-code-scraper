name: Daily Code Scraper

on:
  schedule:
    # Runs at 3:30 AM UTC, which is 9:00 AM IST
    - cron: '30 3 * * *' 
  workflow_dispatch: # Allows manual testing

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to save the known_codes.txt file

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
          
      - name: Run scrapers
        env: # Both secrets are loaded here!
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_WUWA: ${{ secrets.DISCORD_WEBHOOK_WUWA }}
        run: |
          python scraper.py
          python scraper_wuwa.py

      - name: Save known codes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add known_codes.txt
          git commit -m "Update known codes" || echo "No new codes to save"
          git push
