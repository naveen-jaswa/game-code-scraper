name: Daily Code Scraper

on:
  schedule:
    # Runs at 3:30 AM UTC (9:00 AM IST)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual testing

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit codes.json and known_codes.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run unified scraper
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_WUWA: ${{ secrets.DISCORD_WEBHOOK_WUWA }}
        run: |
          python scraper.py

      - name: Save codes.json and known_codes.txt
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add codes.json known_codes.txt
          git commit -m "Update codes.json and known codes" || echo "No new changes to commit"
          git push
